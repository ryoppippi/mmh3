[package]
name = "mmh3-studio"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "fa07f485dd52d8f66db317460566ef4dc4784821", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "fa07f485dd52d8f66db317460566ef4dc4784821" }
ureq = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "fa07f485dd52d8f66db317460566ef4dc4784821" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
